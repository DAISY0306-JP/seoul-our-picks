<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<!-- connect-src 'none': this page cannot send anything anywhere. The QR is drawn inside the browser. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>QR</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--bg:#F2F4F6;--surface:#fff;--ink:#0F1419;--muted:#4A545E;--faint:#77818B;--rule:#DCE2E7;--warn:#985600;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0D1012;--surface:#171B1E;--ink:#EEF1F3;--muted:#B3BBC3;--faint:#8D97A0;--rule:#323A40;--warn:#F2B04C;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:440px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:4px 0 6px}
p{font-size:14.5px;line-height:1.7;color:var(--muted);margin:0 0 14px}
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:0 1px 2px rgba(15,20,25,.05),0 6px 24px rgba(15,20,25,.06)}
label{display:block;font-size:13.5px;font-weight:700;margin:12px 0 6px}
input{width:100%;font:inherit;font-size:16px;padding:11px 12px;min-height:46px;border:1.5px solid var(--rule);border-radius:10px;background:var(--bg);color:var(--ink)}
.ids{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer}
.go{width:100%;min-height:50px;margin-top:16px;border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:700}
.err{color:var(--warn);font-size:14px;min-height:1.4em;margin:10px 0 0}
#show[hidden],#form[hidden]{display:none}
#show{text-align:center}
.who{font-size:24px;font-weight:700;margin:0 0 4px}
.step{font-size:14px;color:var(--faint);margin:0 0 14px}
.qr{background:#fff;border-radius:16px;padding:14px;display:inline-block;line-height:0}
.qr img{width:min(78vw,330px);height:auto;image-rendering:pixelated}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;min-height:50px;border-radius:12px;border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);font-weight:700;font-size:15.5px}
.row .main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{font-size:13px;color:var(--faint);margin-top:16px;line-height:1.7;text-align:left}
</style>
</head>
<body>
<main>
  <div id="form">
    <h1>ログイン用のQRを作る</h1>
    <p>ID と合言葉を入れると、読み取るだけでログインできるQRを1人ずつ表示します。このページは何も送信せず、保存もしません。</p>
    <form class="card" id="f" autocomplete="off">
      <label>3人のID</label>
      <div class="ids"><input id="i1" aria-label="ID 1人目" autocapitalize="none" spellcheck="false"><input id="i2" aria-label="ID 2人目" autocapitalize="none" spellcheck="false"><input id="i3" aria-label="ID 3人目" autocapitalize="none" spellcheck="false"></div>
      <label for="k">合言葉</label>
      <input id="k" type="password" autocomplete="off">
      <button class="go" type="submit">QRを表示する</button>
      <p class="err" id="err" role="alert"></p>
    </form>
  </div>
  <div id="show" hidden>
    <p class="who" id="who"></p>
    <p class="step" id="step"></p>
    <div class="qr" id="qr"></div>
    <div class="row"><button type="button" id="prev">前の人</button><button type="button" class="main" id="next">次の人</button></div>
    <div class="row"><button type="button" id="done">終わる（消す）</button></div>
    <p class="note">本人のスマホのカメラで読み取ってもらい、開いたらそのブラウザで使い続けてもらいます。iPhoneでホーム画面に追加した場合は、そこでもう一度読み取ってください。<br>スクリーンショットは撮らない・送らないでください。</p>
  </div>
</main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const base=new URL("./",location.href).href;
let list=[],key="",at=0;
function draw(){
  const id=list[at];
  $("who").textContent=id+" さん用";
  $("step").textContent=(at+1)+" / "+list.length;
  const q=qrcode(0,"M");
  q.addData(base+"#i="+encodeURIComponent(id)+"&k="+encodeURIComponent(key),"Byte");
  q.make();
  $("qr").innerHTML=q.createImgTag(8,0);
  $("prev").disabled=at===0;
  $("next").textContent=at===list.length-1?"最初に戻る":"次の人";
}
$("f").addEventListener("submit",e=>{
  e.preventDefault();
  list=["i1","i2","i3"].map(x=>$(x).value.trim().toLowerCase()).filter(Boolean);
  key=$("k").value;
  if(!list.length){$("err").textContent="IDを1つ以上入れてください";return}
  if(list.some(x=>!/^[a-z0-9._@+-]{1,64}$/.test(x))){$("err").textContent="IDは半角の英数字で入れてください";return}
  if(key.length<12){$("err").textContent="合言葉は12文字以上にしてください";return}
  if(typeof qrcode!=="function"){$("err").textContent="QRの部品を読み込めませんでした。開き直してください";return}
  $("k").value="";["i1","i2","i3"].forEach(x=>$(x).value="");
  at=0;$("form").hidden=true;$("show").hidden=false;draw();
});
$("prev").addEventListener("click",()=>{if(at>0){at--;draw()}});
$("next").addEventListener("click",()=>{at=(at+1)%list.length;draw()});
function wipe(){list=[];key="";$("qr").innerHTML="";$("show").hidden=true;$("form").hidden=false;$("err").textContent=""}
$("done").addEventListener("click",wipe);
// Leaving the page or switching apps clears the QR.
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&key)wipe()});
</script>
</body>
</html>
